backend:
  name: git-gateway
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "pages"
    label: "Страницы"
    files:
      - file: "content/home.json"
        label: "Главная страница"
        name: "home"
        fields:
          - { label: "Заголовок Hero", name: "heroTitle", widget: "string" }
          - { label: "Подзаголовок Hero", name: "heroSubtitle", widget: "text" }
          - { label: "Текст кнопки", name: "heroButtonText", widget: "string" }
          - { label: "Цвет акцента (Hex)", name: "accentColor", widget: "string" }
      
      - file: "content/contacts.json"
        label: "Контакты"
        name: "contacts"
        fields:
          - { label: "Адрес", name: "address", widget: "string" }
          - { label: "Телефон", name: "phone", widget: "string" }
          - { label: "Instagram", name: "instagram", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }

  - name: "directions"
    label: "Направления"
    folder: "content/directions"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Название", name: "title", widget: "string" }
      - { label: "Описание", name: "description", widget: "text" }
      - { label: "Иконка (Lucide name)", name: "icon", widget: "string" }
      - { label: "Порядок", name: "order", widget: "number" }
